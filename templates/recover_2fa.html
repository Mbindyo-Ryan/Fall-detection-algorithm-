<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recover 2FA - CARE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-mint-light p-4">
    <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-3xl shadow-2xl border border-gray-100 text-center">
        <!-- Header -->
        <h1 class="text-3xl font-extrabold text-indigo-600 tracking-wider mb-1">CARE SYSTEM</h1>
        <h2 class="text-xl font-bold text-gray-900">Account Recovery</h2>
        <p class="text-sm text-gray-500 mt-2 mb-4">Enter your recovery key to disable Two-Factor Authentication.</p>

        <!-- Error Message -->
        {% if error %}
        <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-xl text-sm mb-4" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <!-- Recovery Form -->
        <form method="POST" action="{{ url_for('recover_2fa') }}" class="space-y-6">
            <div>
                <label for="recovery_key" class="block text-sm font-medium text-gray-700 sr-only">Recovery Key</label>
                <input id="recovery_key" name="recovery_key" type="text" required
                       placeholder="Enter your recovery key"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-center font-mono tracking-wider">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl text-lg font-bold text-white bg-orange-600 hover:bg-orange-700 shadow-md transition duration-150">
                Recover Account & Disable 2FA
            </button>
        </form>

        <p class="text-xs text-gray-400 mt-4">
            Remember your code?
            <a href="{{ url_for('twofa_verification') }}" class="text-indigo-500 hover:underline">Go back to verify</a>.
        </p>
         <p class="text-xs text-gray-400 mt-1">
            Need help?
            <a href="{{ url_for('index') }}" class="text-indigo-500 hover:underline">Return to Login</a>.
        </p>
    </div>
</body>
</html>
