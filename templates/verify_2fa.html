<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify 2FA Code - CARE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        .code-input {
            font-size: 2rem;
            letter-spacing: 0.5em;
            text-align: center;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }
        .code-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen bg-mint-light p-4">
    <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-3xl shadow-2xl border border-gray-100 text-center">
        <!-- Header -->
        <div>
            <div class="flex justify-center mb-4">
                <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center">
                    <span class="text-3xl">🔐</span>
                </div>
            </div>
            <h1 class="text-3xl font-extrabold text-indigo-600 tracking-wider mb-1">CARE SYSTEM</h1>
            <h2 class="text-xl font-bold text-gray-900">Two-Factor Verification</h2>
            <p class="text-sm text-gray-500 mt-3">
                Enter the 6-digit code from your authenticator app
            </p>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div class="p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl text-sm animate-shake" role="alert">
            <span class="font-semibold">⚠️ {{ error }}</span>
        </div>
        {% endif %}

        <!-- 2FA Form -->
        <form method="POST" action="/verify_2fa" class="space-y-6" id="verify-form">
            <!-- Single Input for 6-digit code -->
            <div class="relative">
                <input 
                    type="text" 
                    name="code" 
                    id="code-input"
                    maxlength="6" 
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required 
                    placeholder="000000"
                    class="code-input w-full px-6 py-4 border-2 border-gray-300 rounded-xl focus:border-indigo-500 transition-all"
                    autofocus
                >
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                    <svg id="check-icon" class="hidden h-6 w-6 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
            </div>

            <!-- Visual feedback: dots showing progress -->
            <div class="flex justify-center space-x-2" id="progress-dots">
                <span class="dot w-3 h-3 rounded-full bg-gray-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-gray-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-gray-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-gray-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-gray-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-gray-300"></span>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submit-btn"
                class="w-full py-4 px-4 rounded-xl text-lg font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg transition-all duration-150 transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                <span id="btn-text">Verify Code</span>
                <span id="btn-loading" class="hidden">
                    <svg class="animate-spin inline h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Verifying...
                </span>
            </button>
        </form>

        <!-- Help Links -->
        <div class="space-y-2 pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-500">
                Lost access to your authenticator app?
            </p>
            <a href="{{ url_for('recover_2fa') }}" class="inline-block text-sm text-orange-600 hover:text-orange-700 font-semibold hover:underline">
                🔑 Use Recovery Key
            </a>
        </div>

        <div class="pt-2">
            <a href="{{ url_for('index') }}" class="text-xs text-gray-500 hover:text-gray-700 hover:underline">
                ← Back to login
            </a>
        </div>
    </div>

    <script>
        const codeInput = document.getElementById('code-input');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoading = document.getElementById('btn-loading');
        const checkIcon = document.getElementById('check-icon');
        const progressDots = document.querySelectorAll('.dot');
        const form = document.getElementById('verify-form');

        // Auto-format input (numbers only)
        codeInput.addEventListener('input', (e) => {
            // Remove non-numeric characters
            let value = e.target.value.replace(/[^0-9]/g, '');
            e.target.value = value;

            // Update progress dots
            progressDots.forEach((dot, index) => {
                if (index < value.length) {
                    dot.classList.remove('bg-gray-300');
                    dot.classList.add('bg-indigo-600');
                } else {
                    dot.classList.remove('bg-indigo-600');
                    dot.classList.add('bg-gray-300');
                }
            });

            // Show check icon when 6 digits entered
            if (value.length === 6) {
                checkIcon.classList.remove('hidden');
                submitBtn.disabled = false;
                
                // Auto-submit after 6 digits (optional)
                setTimeout(() => {
                    if (codeInput.value.length === 6) {
                        form.submit();
                    }
                }, 300);
            } else {
                checkIcon.classList.add('hidden');
                submitBtn.disabled = value.length < 6;
            }
        });

        // Paste support
        codeInput.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
            codeInput.value = pastedData;
            codeInput.dispatchEvent(new Event('input'));
        });

        // Loading state on submit
        form.addEventListener('submit', () => {
            btnText.classList.add('hidden');
            btnLoading.classList.remove('hidden');
            submitBtn.disabled = true;
        });

        // Focus input on load
        window.addEventListener('load', () => {
            codeInput.focus();
        });

        // Clear on error
        {% if error %}
        codeInput.value = '';
        codeInput.focus();
        codeInput.classList.add('border-red-500');
        setTimeout(() => {
            codeInput.classList.remove('border-red-500');
        }, 2000);
        {% endif %}
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</body>
</html>
