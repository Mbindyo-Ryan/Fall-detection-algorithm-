<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Up 2FA | CARE System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    body {
      background: #f8f9fc;
      font-family: "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      width: 400px;
      text-align: center;
    }
    h2 {
      margin-bottom: 1rem;
      color: #333;
    }
    img.qr {
      width: 180px;
      height: 180px;
      margin: 1rem 0;
    }
    .secret {
      background: #f1f3f5;
      padding: 0.5rem;
      border-radius: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 4px;
    }
    button {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #0056b3;
    }
    .note {
      font-size: 0.9rem;
      color: #555;
      margin-top: 1rem;
    }
    .error {
      color: #c00;
      background: #ffeaea;
      padding: 0.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .success {
      color: #090;
      background: #e7ffe7;
      padding: 0.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Set Up Two-Factor Authentication</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% elif success %}
      <div class="success">{{ success }}</div>
    {% endif %}
    <p>Scan this QR code using the <strong>Google Authenticator</strong> app.</p>

    <img class="qr" src="{{ qr_code }}" alt="QR Code">

    <p>Or enter this code manually:</p>
    <div class="secret">{{ secret }}</div>

    <form method="POST">
      <p>After scanning, enter the 6-digit code from your app:</p>
      <input type="text" name="code" placeholder="123456" maxlength="6" required autofocus>
      <button type="submit">Enable 2FA</button>
    </form>

    <div class="note">
      <p><a href="{{ url_for('dashboard') }}">Cancel and go back</a></p>
    </div>
  </div>
</body>
</html>
